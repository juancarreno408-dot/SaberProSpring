<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Estudiante</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Dashboard Estudiante')}"></div><section class="student-hero" th:if="${estudiante != null}"><div><p class="eyebrow">Datos personales</p><h2 th:text="${estudiante.nombreCompleto}">Estudiante</h2><p th:text="${estudiante.numeroRegistro}">Registro</p></div><strong th:text="${resultado != null && resultado.puntaje != null ? resultado.puntaje : resultado != null ? resultado.estado : 'Sin resultado'}">0</strong></section><section class="panel"><h2>Ultimo resultado</h2><div class="score-grid" th:if="${resultado != null}"><span>Comunicacion escrita <b th:text="${resultado.comunicacionEscrita}">0</b></span><span>Razonamiento cuantitativo <b th:text="${resultado.razonamientoCuantitativo}">0</b></span><span>Lectura critica <b th:text="${resultado.lecturaCritica}">0</b></span><span>Ingles <b th:text="${resultado.ingles}">0</b></span><span>Diseno de software <b th:text="${resultado.disenoSoftware}">0</b></span><span>Nivel ingles <b th:text="${resultado.nivelIngles}">A1</b></span></div></section></main></div></body></html>
