<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resultado detallado</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Resultado detallado')}"></div><section class="student-hero"><div><p class="eyebrow">Registro</p><h2 th:text="${estudiante.primerApellido}">Estudiante</h2><p th:text="${estudiante.numeroRegistro}">Registro</p></div><strong th:text="${resultado != null && resultado.puntaje != null ? resultado.puntaje : resultado != null ? resultado.estado : 'Sin resultado'}">0</strong></section><section class="panel" th:if="${resultado != null}"><div class="score-grid"><span>Comunicacion escrita <b th:text="${resultado.comunicacionEscrita}">0</b></span><span>Razonamiento cuantitativo <b th:text="${resultado.razonamientoCuantitativo}">0</b></span><span>Lectura critica <b th:text="${resultado.lecturaCritica}">0</b></span><span>Competencias ciudadanas <b th:text="${resultado.competenciasCiudadanas}">0</b></span><span>Ingles <b th:text="${resultado.ingles}">0</b></span><span>Formulacion proyectos <b th:text="${resultado.formulacionProyectos}">0</b></span><span>Pensamiento cientifico <b th:text="${resultado.pensamientoCientifico}">0</b></span><span>Diseno software <b th:text="${resultado.disenoSoftware}">0</b></span></div></section></main></div></body></html>
