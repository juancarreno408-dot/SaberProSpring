<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Informe general</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Informe General')}"></div><section class="metrics"><article><span>Total alumnos</span><strong th:text="${totalEstudiantes}">0</strong></article><article><span>Promedio Saber Pro</span><strong th:text="${#numbers.formatDecimal(promedioGlobal,1,1)}">0</strong></article></section><section class="split"><div class="panel"><h2>Promedios por competencia</h2><div th:each="c : ${competencias}" class="bar-row"><span th:text="${c.nombre}">Competencia</span><div><i th:style="'width:' + ${c.promedio / 3} + '%'"></i></div><b th:text="${#numbers.formatDecimal(c.promedio,1,1)}">0</b></div></div><div class="panel"><h2>Niveles globales</h2><div th:each="n : ${niveles}" class="rank"><b th:text="${n.nivel}">Nivel</b><span th:text="${n.cantidad}">0</span></div></div></section></main></div></body></html>
