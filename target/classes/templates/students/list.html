<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Estudiantes</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Gestionar Estudiante')}"></div><section class="toolbar"><form th:action="@{/students}" method="get"><input name="q" th:value="${q}" placeholder="Buscar por apellido o registro"><button>Buscar</button></form><a class="button" th:href="@{/students/new}">Nuevo</a></section><section class="panel table-panel"><table><thead><tr><th>Apellido</th><th>Registro</th><th>Puntaje</th><th>Nivel ingles</th><th>Aprobado</th><th></th></tr></thead><tbody><tr th:each="e : ${estudiantes}"><td th:text="${e.primerApellido}">Apellido</td><td th:text="${e.numeroRegistro}">Registro</td><td th:text="${e.resultado != null ? e.resultado.puntaje : '-'}">0</td><td th:text="${e.resultado != null ? e.resultado.nivelIngles : '-'}">A1</td><td th:text="${e.aprobadoSaberPro ? 'Si' : 'No'}">Si</td><td><a th:href="@{/students/{id}/edit(id=${e.id})}">Editar</a></td></tr></tbody></table></section></main></div></body></html>
