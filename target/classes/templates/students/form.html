<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar estudiante</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Editar estudiante')}"></div><section class="panel"><form class="form-grid" th:action="@{/students/save}" th:object="${estudiante}" method="post"><input type="hidden" th:field="*{id}"><label>Tipo documento<input th:field="*{tipoDocumento}"></label><label>Numero documento<input th:field="*{numeroDocumento}"></label><label>Primer nombre<input th:field="*{primerNombre}"></label><label>Segundo nombre<input th:field="*{segundoNombre}"></label><label>Primer apellido<input th:field="*{primerApellido}" required></label><label>Segundo apellido<input th:field="*{segundoApellido}"></label><label>Correo<input th:field="*{correoElectronico}"></label><label>Telefono<input th:field="*{numeroTelefonico}"></label><label>Registro<input th:field="*{numeroRegistro}"></label><label class="check"><input type="checkbox" th:field="*{aprobadoSaberPro}"> Aprobado Saber Pro</label><div class="form-actions"><a th:href="@{/students}">Cancelar</a><button>Guardar</button></div></form></section></main></div></body></html>
