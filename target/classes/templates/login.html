<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Saber Pro | Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><main class="login-shell"><section class="login-panel"><div class="brand-mark">SP</div><p class="eyebrow">Sistema academico</p><h1>Saber Pro</h1><p class="muted">Seguimiento de resultados, informes y beneficios por rol.</p><form th:action="@{/login}" method="post" class="login-form"><label>Usuario<input name="username" autocomplete="username" required></label><label>Clave<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Ingresar</button><p class="error" th:if="${param.error}">Credenciales incorrectas.</p><p class="success" th:if="${param.logout}">Sesion cerrada correctamente.</p></form><div class="demo-users"><span>admin/admin123</span><span>coordinador/coordinador123</span><span>docente/docente123</span><span>estudiante/estudiante123</span></div></section></main></body></html>
