<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Informe detallado</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div th:replace="~{fragments/layout :: topbar('Informe detallado')}"></div><section class="panel table-panel"><table><thead><tr><th>Estudiante</th><th>Registro</th><th>Global</th><th>Com. escrita</th><th>Raz. cuant.</th><th>Lectura</th><th>Ingles</th><th></th></tr></thead><tbody><tr th:each="e : ${estudiantes}"><td th:text="${e.primerApellido}">Apellido</td><td th:text="${e.numeroRegistro}">Registro</td><td th:text="${e.resultado != null ? e.resultado.puntaje : '-'}">0</td><td th:text="${e.resultado != null ? e.resultado.comunicacionEscrita : '-'}">0</td><td th:text="${e.resultado != null ? e.resultado.razonamientoCuantitativo : '-'}">0</td><td th:text="${e.resultado != null ? e.resultado.lecturaCritica : '-'}">0</td><td th:text="${e.resultado != null ? e.resultado.ingles : '-'}">0</td><td><a th:href="@{/reports/students/{id}(id=${e.id})}">Ver</a></td></tr></tbody></table></section></main></div></body></html>
