<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinación</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="app">
        <div th:replace="~{fragments/layout :: sidebar}"></div>
        
        <main class="content">
            <div th:replace="~{fragments/layout :: topbar('Dashboard Coordinación')}"></div>
            
            <section class="metrics">
                <article>
                    <span>Alumnos</span>
                    <strong th:text="${totalEstudiantes}">0</strong>
                </article>
                <article>
                    <span>Aprobados Saber Pro</span>
                    <strong th:text="${aprobados}">0</strong>
                </article>
                <article>
                    <span>Promedio</span>
                    <strong th:text="${#numbers.formatDecimal(promedioGlobal,1,1)}">0</strong>
                </article>
            </section>

            <section class="panel">
                <h2>Operaciones de coordinación</h2>
                <div class="action-grid">
                    <a th:href="@{/students}">CRUD alumnos</a>
                    <a th:href="@{/reports/students}">Informe alumnos total/unico</a>
                    <a th:href="@{/reports}">Informe general</a>
                    <a th:href="@{/benefits}">Informe beneficios</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
